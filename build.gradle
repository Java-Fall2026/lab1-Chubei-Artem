plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'ua.store.Main'
}
repositories {
    mavenCentral()
}
// tasks.withType(JavaCompile).configureEach {
//     options.encoding = 'UTF-8'
// }

// tasks.withType(JavaExec).configureEach {
//     defaultCharacterEncoding = 'UTF-8'
// }
// WRITE IN TERMINAL B4 RUN chcp 65001; [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
tasks.withType(JavaExec).configureEach {
    defaultCharacterEncoding = 'UTF-8'
    jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8'
}

// --- lab3: unit tests ---
dependencies {
    // --- SLF4J + Logback ---
    implementation 'org.slf4j:slf4j-api:2.0.12'
    runtimeOnly    'ch.qos.logback:logback-classic:1.5.3'
    // --- JUnit ---
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
    // --- Jackson 2.x (JSON, YAML, Java Time JSR-310) ---
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    // --- Jakarta Validation (Hibernate Validator + Expressly EL) ---
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    implementation 'org.glassfish.expressly:expressly:5.0.0'
    // --- Jetty 12 (Jakarta Servlet 6.0 / EE10) ---
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.0.16'
}

test {
    useJUnitPlatform()
}

tasks.register('runBenchmark', JavaExec) {
    group = 'application'
    description = 'Runs SearchBenchmark on 100,000 items'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ua.store.repository.SearchBenchmark'
    defaultCharacterEncoding = 'UTF-8'
    jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8', '-Xms512m', '-Xmx2g'
}
